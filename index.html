<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anurag ❤️ Priya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md bg-white p-6 rounded-3xl shadow-xl"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy,
  onSnapshot, doc, setDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {
apiKey: "AIzaSyDaN4GKniHYpqtfqVd49PbtSBDv81Ar6VA",
  authDomain: "couple-chat-98128.firebaseapp.com",
  projectId: "couple-chat-98128",
  storageBucket: "couple-chat-98128.firebasestorage.app",
  messagingSenderId: "802286762049",
  appId: "1:802286762049:web:8f6f441e7c2630deea6ec0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const storage = getStorage(app);

const USERS = ["Anurag", "Priyabetu"];
const PASSWORD = "betupriya";

let currentUser = "";
let loggedIn = false;
let allMessages = [];
let typingText = "";

function render() {
  const currentDraft = document.getElementById("msg")?.value || "";
  const appDiv = document.getElementById("app");
  if (!loggedIn) {
    appDiv.innerHTML = `
      <h1 class="text-3xl font-bold text-center text-pink-600 mb-6">Anurag ❤️ Priya</h1>
      <input id="name" class="w-full border p-3 rounded-xl mb-3" placeholder="Anurag or Priyabetu">
      <input id="pass" type="password" class="w-full border p-3 rounded-xl mb-3" placeholder="Password">
      <button id="loginBtn" type="button" class="w-full bg-pink-500 text-white p-3 rounded-xl">Enter</button>
    `;
    document.getElementById("loginBtn").onclick = login;
    return;
  }

  appDiv.innerHTML = `
    <h1 class="text-2xl font-bold text-pink-600 mb-2">💕 ${currentUser}</h1>
    <div class="text-sm text-gray-500 h-5 mb-2">${typingText}</div>

    <div class="h-72 overflow-y-auto border rounded-xl p-3 mb-3 bg-pink-50">
      ${allMessages.map(m => `
        <div class="mb-3">
          <b>${m.user}:</b>
          ${
            m.type === "text"
              ? m.text
              : `<a href="${m.text}" target="_blank" class="text-blue-500 underline">Open File</a>`
          }
          <button onclick="window.deleteMessage('${m.id}')" class="text-red-500 text-xs ml-2">Delete</button>
        </div>
      `).join("")}
    </div>

    <div class="flex gap-2 mb-2">
      <input id="msg" value="${currentDraft}" class="flex-1 border p-3 rounded-xl" placeholder="Type message...">
      <button id="sendBtn" type="button" class="bg-pink-500 text-white px-4 rounded-xl">Send</button>
    </div>

    <input id="file" type="file" accept="image/*,video/*,audio/*" class="mb-2 w-full">
    <button id="uploadBtn" type="button" class="w-full bg-purple-500 text-white p-3 rounded-xl">Upload Pic/Video/Voice</button>
  `;

  document.getElementById("sendBtn").onclick = sendMsg;
  document.getElementById("uploadBtn").onclick = uploadFile;

  const msgInput = document.getElementById("msg");
  msgInput.oninput = async () => {
    await setDoc(doc(db, "typing", "status"), {
      user: currentUser,
      typing: msgInput.value.length > 0
    });
  };
}

function login() {
  const n = document.getElementById("name").value.trim();
  const p = document.getElementById("pass").value;

  if (USERS.includes(n) && p === PASSWORD) {
    currentUser = n;
    loggedIn = true;
    render();

    const q = query(collection(db, "messages"), orderBy("createdAt"));
    onSnapshot(q, (snap) => {
      allMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    });

    onSnapshot(doc(db, "typing", "status"), (snap) => {
      const t = snap.data();
      typingText = (t && t.typing && t.user !== currentUser)
        ? `${t.user} is typing...`
        : "";
      render();
    });

  } else {
    alert("Wrong username or password");
  }
}

async function sendMsg() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  await addDoc(collection(db, "messages"), {
    user: currentUser,
    text,
    type: "text",
    createdAt: Date.now()
  });

  input.value = "";
  await setDoc(doc(db, "typing", "status"), { user: currentUser, typing: false });
}

async function uploadFile() {
  const file = document.getElementById("file").files[0];
  if (!file) return alert("Select a file");

  const fileRef = ref(storage, "uploads/" + Date.now() + "_" + file.name);
  try {
  await uploadBytes(fileRef, file);
  const url = await getDownloadURL(fileRef);

  await addDoc(collection(db, "messages"), {
    user: currentUser,
    text: url,
    type: "file",
    createdAt: Date.now()
  });

  alert("Uploaded!");
} catch (e) {
  alert("Upload failed: " + e.message);
}

  await addDoc(collection(db, "messages"), {
    user: currentUser,
    text: url,
    type: "file",
    createdAt: Date.now()
  });

  alert("Uploaded!");
}

window.deleteMessage = async (id) => {
  await deleteDoc(doc(db, "messages", id));
};

render();
</script>
</body>
</html>
