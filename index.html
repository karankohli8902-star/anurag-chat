<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anurag ❤️ Priya</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md bg-white p-6 rounded-3xl shadow-xl"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, query, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDaN4GKniHYpqtfqVd49PbtSBDv81Ar6VA",
  authDomain: "couple-chat-98128.firebaseapp.com",
  projectId: "couple-chat-98128",
  storageBucket: "couple-chat-98128.firebasestorage.app",
  messagingSenderId: "802286762049",
  appId: "1:802286762049:web:8f6f441e7c2630deea6ec0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const USERS = ["Anurag", "Priyabetu"];
const PASSWORD = "betupriya";
let currentUser = "";
let loggedIn = false;

function render(messages=[]){
  const appDiv = document.getElementById("app");

  if(!loggedIn){
    appDiv.innerHTML = `
      <h1 class="text-3xl font-bold text-center text-pink-600 mb-6">Anurag ❤️ Priya</h1>
      <input id="name" class="w-full border p-3 rounded-xl mb-3" placeholder="Anurag or Priyabetu">
      <input id="pass" type="password" class="w-full border p-3 rounded-xl mb-3" placeholder="Password">
      <button id="loginBtn" type="button" class="w-full bg-pink-500 text-white p-3 rounded-xl">Enter</button>
    `;
    document.getElementById("loginBtn").addEventListener("click", login);
    return;
  }

  appDiv.innerHTML = `
    <h1 class="text-2xl font-bold text-pink-600 mb-4">💕 ${currentUser}</h1>
    <div class="h-80 overflow-y-auto border rounded-xl p-3 mb-3 bg-pink-50">
      ${messages.map(m => `<div><b>${m.user}:</b> ${m.text}</div>`).join("")}
    </div>
    <div class="flex gap-2">
      <input id="msg" class="flex-1 border p-3 rounded-xl" placeholder="Type message...">
      <button id="sendBtn" type="button" class="bg-pink-500 text-white px-4 rounded-xl">Send</button>
    </div>
  `;

  document.getElementById("sendBtn").addEventListener("click", sendMsg);
}

function login(){
  const n = document.getElementById("name").value.trim();
  const p = document.getElementById("pass").value;

  if(USERS.includes(n) && p === PASSWORD){
    currentUser = n;
    loggedIn = true;

    const q = query(collection(db, "messages"), orderBy("createdAt"));
    onSnapshot(q, (snap)=>{
      const msgs = snap.docs.map(d=>d.data());
      render(msgs);
    });

  } else {
    alert("Wrong username or password");
  }
}

async function sendMsg(){
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if(!text) return;

  await addDoc(collection(db, "messages"), {
    user: currentUser,
    text,
    createdAt: Date.now()
  });

  input.value = "";
}

render();
</script>
</body>
</html>
